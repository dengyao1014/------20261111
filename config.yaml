# 采集配置。kind: discourse | github | wordpress | reddit

sources:
  - name: Shopify 社区
    kind: discourse
    platform: Shopify
    base_url: https://community.shopify.com
    pages: 2

  - name: Nextcloud 论坛
    kind: discourse
    platform: Nextcloud
    base_url: https://help.nextcloud.com
    pages: 2

  - name: Obsidian 论坛
    kind: discourse
    platform: Obsidian
    base_url: https://forum.obsidian.md
    pages: 1

  - name: Mattermost 论坛
    kind: discourse
    platform: Mattermost
    base_url: https://forum.mattermost.com
    pages: 1

  - name: n8n 社区
    kind: discourse
    platform: n8n
    base_url: https://community.n8n.io
    pages: 1

  - name: TrueNAS 论坛
    kind: discourse
    platform: TrueNAS
    base_url: https://forums.truenas.com
    pages: 1

  - name: Bitwarden 社区
    kind: discourse
    platform: Bitwarden
    base_url: https://community.bitwarden.com
    pages: 1

  # GitHub Issues：没有 token 时限 10 次搜索/分钟
  - name: GitHub Issues
    kind: github
    platform: GitHub
    per_page: 10
    queries:
      - repo:mattermost/mattermost label:"kind/feature" state:open
      - repo:nextcloud/server label:"enhancement" state:open

  # WordPress 插件支持论坛（RSS）
  - name: WordPress 支持论坛
    kind: wordpress
    platform: WordPress
    feeds:
      - https://wordpress.org/support/plugin/elementor/feed/
      - https://wordpress.org/support/plugin/woocommerce/feed/

  # Reddit 在当前网络不可达。需要代理时取消注释并填 proxy：
  # - name: Reddit r/shopify
  #   kind: reddit
  #   platform: Reddit
  #   subs: [shopify]
  #   proxy: http://127.0.0.1:7890

# LLM 设置（也可用环境变量 DEMAND_PROVIDER / DEMAND_MODEL 覆盖）
provider: deepseek
model: deepseek-chat
# 想换回 Claude：provider: anthropic, model: claude-opus-5-5

# 每轮最多调用多少次 LLM（控制成本）
max_llm_calls: 40

# 并发分析线程数
extract_workers: 4

# 是否联网核实竞品（用 Bing RSS，不需要 key）
verify_competitors: true

# 跨帖聚类阈值（0-1，越高越难合并）
cluster_threshold: 0.72

# 日报条数
top_n: 30

# 默认请求间隔（秒），对论坛保持礼貌
request_delay: 1.0

db_path: data/demand.db
report_dir: out
